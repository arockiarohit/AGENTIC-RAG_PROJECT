# ==============================================================================
# District RAG Chatbot - Docker Compose
# ==============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: district-rag-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # Persist vector index, uploaded docs, and generated images
      - ./backend/uploads:/app/uploads
      - ./backend/faiss_index:/app/faiss_index
      - ./backend/generated_images:/app/generated_images
