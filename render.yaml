# ==============================================================================
# Render Blueprint Specification (render.yaml)
# Deploy Frontend (Static Site) and Backend (Python Web Service) automatically
# ==============================================================================

services:
  # -------------------------------------------------------------
  # 1. FastAPI Backend Service
  # -------------------------------------------------------------
  - type: web
    name: district-rag-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: HF_TOKEN
        sync: false

  # -------------------------------------------------------------
  # 2. React Vite Frontend (Static Site)
  # -------------------------------------------------------------
  - type: static
    name: district-rag-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: district-rag-backend
          property: host
